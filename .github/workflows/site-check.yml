# synk.im 배포 점검(2026-10-03). main에 올라갈 때마다 공개 사이트가 바뀐 대로 나왔는지, 페이지·LAB 게임·질문창이 도는지,
# 제작 도구 이름이 없는지 본다. 점검 내용과 기준은 .github/site-check/check.mjs 머리글에 있다.
# 공개 저장소라 실행 시간은 무료다. 잇달아 올라가면 앞의 점검은 멈추고 마지막 것만 끝까지 돈다.
# 그래서 반영 기다리기는 마지막으로 통과한 점검의 커밋부터 바뀐 파일을 본다(그 커밋을 찾느라 actions: read).
# 6단계(2026-10-21)는 쪽마다 그림을 기준(.github/site-check/baseline/)과 견주고 axe를 돌린다. 기준 그림이 점검 환경에 묶이므로
# 실행기를 ubuntu-24.04로 고정한다(ubuntu-latest가 넘어가면 모든 쪽이 조금씩 달라진다). 이 회차 캡처는 site-check-shots로 남긴다 —
# 의도한 변경이면 SYNK-appsscript의 `node tools/공개.js 기준`이 그것을 기준으로 올린다.
name: synk.im 배포 점검
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: site-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 플레이라이트 준비
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1 odiff-bin@4.5.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: 재검사 규칙 회귀 검사
        run: node --test .github/site-check/*.test.mjs
      - name: 점검
        run: node .github/site-check/check.mjs
        env:
          SITE_BASE: https://synk.im
          GH_TOKEN: ${{ github.token }}
      - name: 첫 실패와 재검사 기록 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-check-screens
          path: site-check-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: 이 회차 캡처 올리기(기준 갱신용)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-check-shots
          path: site-check-shots
          if-no-files-found: ignore
          retention-days: 30
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-check-result
          path: site-check-artifacts/result.json
          if-no-files-found: ignore
          retention-days: 30
