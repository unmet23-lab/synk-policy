name: SYNK Platform Performance Preview
on:
  workflow_dispatch:
  push:
    branches: [codex/platform-performance-043-20261012]
    paths: ['.github/desktop-preview/**', '.github/workflows/desktop-platform-performance.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .github/desktop-preview
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: .github/desktop-preview/package-lock.json
      - run: npm ci --no-audit --no-fund
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: '1'}
      - run: node node_modules/electron/install.js
        env: {npm_config_arch: '${{ matrix.arch }}'}
      - name: Build Intel graphics loader
        if: matrix.arch == 'x64'
        run: bash build-vulkan-loader.sh
      - run: node build-platform-performance.cjs --validate-only
      - run: node build-platform-performance.cjs --arch=${{ matrix.arch }}
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - name: Verify actual mounted DMGs and native Platform
        run: node qa/run-macos-qa.cjs --arch=${{ matrix.arch }} --scope=platform
        env:
          SYNK_QA_VISIBLE: '1'
          SYNK_QA_SOFTWARE_GPU: ${{ matrix.arch == 'x64' && '1' || '0' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synk-platform-performance-${{ matrix.arch }}
          path: |
            .github/desktop-preview/dist/${{ matrix.arch }}/deliverables/
            .github/desktop-preview/qa-results/${{ matrix.arch }}/mac-native-qa.json
            .github/desktop-preview/qa-results/${{ matrix.arch }}/platform/report.json
            .github/desktop-preview/qa-results/${{ matrix.arch }}/platform/*.png
            .github/desktop-preview/qa-results/${{ matrix.arch }}/*-process.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
