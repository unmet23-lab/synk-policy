name: SYNK immutable native evidence extraction
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Verify immutable original native evidence ZIPs and extract JSON
        type: choice
        options: [native-evidence]
        default: native-evidence
permissions:
  contents: read
  actions: read
jobs:
  native-evidence:
    if: github.event.inputs.targets == 'native-evidence'
    name: Verify original native QA ZIPs and extract reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify original immutable ZIP bytes and extract JSON without changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/native-evidence/extract.py
      - name: Preserve the verified original ZIP bytes
        uses: actions/upload-artifact@v7
        with:
          name: original-native-zips-0.4.22
          path: native-evidence-original-zips
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save small original JSON and provenance
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-json-0.4.22
          path: native-evidence-small
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
