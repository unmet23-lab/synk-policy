name: SYNK Platform anonymous public artifact verification
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Anonymous full-byte public artifact verification only
        type: choice
        options: [public-verify]
        default: public-verify
permissions:
  contents: read
jobs:
  public-verify:
    if: github.event.inputs.targets == 'public-verify'
    name: Anonymous full public artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read all three public assets anonymously and verify bytes and SHA256
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: node .github/public-verification/verify-public-artifacts.cjs
      - name: Save small immutable full-download evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-artifact-verification-0.4.21
          path: public-artifact-verification/report.json
          if-no-files-found: error
          retention-days: 14
